<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Scripts Runner 2</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/iconify/3.1.1/iconify.min.js"
      defer></script>
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 400;
        font-display: swap;
        src: url("https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@2.304/fonts/webfonts/JetBrainsMono-Regular.woff2")
          format("woff2");
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-weight: 700;
        font-display: swap;
        src: url("https://cdn.jsdelivr.net/gh/JetBrains/JetBrainsMono@2.304/fonts/webfonts/JetBrainsMono-Bold.woff2")
          format("woff2");
      }
      :root {
        color-scheme: light dark;
        --accent: #6fd6c4;
        --bg: light-dark(#f3f7f6, #0b1110);
        --panel: light-dark(#ffffff, #111a18);
        --raised: light-dark(#edf5f3, #192622);
        --rule: light-dark(#d8e3e0, #263a35);
        --ink: light-dark(#17201e, #e5efec);
        --muted: light-dark(#62706c, #8da09b);
        font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      * { box-sizing: border-box; }
      body {
        height: 100dvh;
        margin: 0;
        overflow: hidden;
        color: var(--ink);
        background:
          radial-gradient(circle at 20% 0%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 34rem),
          var(--bg);
      }
      button { font: inherit; }
      main {
        display: grid;
        grid-template-columns: minmax(280px, 360px) minmax(0, 1fr);
        grid-template-rows: auto auto minmax(0, 1fr);
        gap: 24px;
        width: min(1180px, calc(100% - 32px));
        height: 100%;
        margin: 0 auto;
        padding: clamp(28px, 5vh, 56px) 0;
      }
      header { grid-column: 1 / -1; }
      .eyebrow {
        margin: 0 0 8px;
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .16em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); letter-spacing: -.04em; }
      .intro { max-width: 560px; margin: 8px 0 0; color: var(--muted); }
      #output-controls {
        grid-column: 1 / -1;
        display: inline-grid;
        grid-template-columns: auto auto auto;
        align-items: center;
        justify-self: start;
        gap: 0;
        width: auto;
        max-width: 100%;
        margin-top: 16px;
        padding: 0;
        color: var(--muted);
        border: 1px solid var(--rule);
        border-radius: 10px;
        background: color-mix(in srgb, var(--panel) 84%, transparent);
        font-size: 12px;
        overflow: hidden;
      }
      .control-group {
        display: flex;
        align-items: center;
        gap: 8px;
        min-height: 48px;
        padding: 8px 14px;
        border-right: 1px solid var(--rule);
      }
      .control-group > .iconify { color: var(--accent); font-size: 17px; }
      .preset-options { display: flex; gap: 4px; }
      .preset-options button {
        padding: 5px 9px;
        color: var(--ink);
        border: 1px solid var(--rule);
        border-radius: 6px;
        background: var(--raised);
        cursor: pointer;
      }
      .preset-options button[aria-pressed="true"] {
        color: #08201b;
        border-color: var(--accent);
        background: var(--accent);
      }
      #zen-toggle {
        display: flex;
        align-items: center;
        gap: 7px;
        align-self: stretch;
        padding: 8px 14px;
        color: var(--ink);
        border: 0;
        border-radius: 0;
        background: transparent;
        cursor: pointer;
      }
      #zen-toggle:hover { background: var(--raised); }
      kbd {
        padding: 1px 5px;
        color: var(--muted);
        border: 1px solid var(--rule);
        border-radius: 4px;
        background: var(--panel);
        font: inherit;
      }
      #zen-indicator {
        position: fixed;
        top: 12px;
        right: 12px;
        z-index: 10;
        display: none;
        align-items: center;
        gap: 7px;
        padding: 6px 9px;
        color: var(--accent);
        border: 1px solid var(--rule);
        border-radius: 7px;
        background: var(--panel);
        box-shadow: 0 8px 24px #0004;
        font-size: 11px;
        cursor: pointer;
      }
      #terminal-close {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 31;
        display: none;
        place-items: center;
        width: 36px;
        height: 36px;
        padding: 0;
        color: #e6edf3;
        border: 1px solid #343c49;
        border-radius: 7px;
        background: #171c25;
        font-size: 20px;
        cursor: pointer;
      }
      #terminal-close:hover { color: var(--accent); background: #232a35; }
      #scripts {
        display: grid;
        align-content: start;
        gap: 12px;
        min-width: 0;
      }
      .script-group {
        margin: 4px 2px -4px;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: .14em;
        text-transform: uppercase;
      }
      .script {
        position: relative;
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto 1fr;
        gap: 10px 16px;
        align-items: center;
        min-height: 142px;
        padding: 16px;
        border: 1px solid var(--rule);
        border-radius: 12px;
        background: color-mix(in srgb, var(--panel) 92%, transparent);
        box-shadow: 0 10px 28px color-mix(in srgb, #000 10%, transparent);
        cursor: pointer;
        transition: border-color .15s, background .15s, box-shadow .15s, transform .15s;
      }
      .script:hover {
        border-color: color-mix(in srgb, var(--accent) 55%, var(--rule));
        transform: translateY(-1px);
      }
      .script[aria-selected="true"] {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 8%, var(--panel));
        box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent),
          0 14px 34px color-mix(in srgb, #000 16%, transparent);
      }
      .script[data-ran="true"]:not([aria-selected="true"]) {
        background: color-mix(in srgb, var(--accent) 3%, var(--panel));
      }
      .script h2 {
        display: flex;
        align-items: center;
        gap: 7px;
        margin: 0;
        font-size: 15px;
        line-height: 1.35;
      }
      .run-mark {
        flex: none;
        color: var(--accent);
        font-size: 14px;
      }
      .script p {
        display: -webkit-box;
        grid-column: 1;
        align-self: start;
        margin: 0;
        overflow: hidden;
        color: var(--muted);
        -webkit-box-orient: vertical;
        -webkit-line-clamp: 4;
      }
      .script button {
        grid-column: 2;
        grid-row: 1 / span 2;
        display: grid;
        place-items: center;
        width: 39px;
        height: 39px;
        padding: 0;
        color: #08201b;
        font-size: 20px;
        border: 0;
        border-radius: 8px;
        background: var(--accent);
        cursor: pointer;
      }
      .script button:hover { filter: brightness(1.08); }
      .script button:disabled { cursor: wait; opacity: .6; }
      #output {
        min-width: 0;
        min-height: 0;
        height: 100%;
        margin: 0;
        padding: 14px 16px 28px;
        overflow: auto;
        color: #e6edf3;
        border: 1px solid #343c49;
        border-radius: 0;
        background: #0d1117;
        box-shadow: 0 16px 50px #0009;
        font: 12px/1 "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-variant-ligatures: none;
        tab-size: 4;
        white-space: pre;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, .13) transparent;
      }
      #output:empty::before { content: "Output will appear here."; color: #687a75; }
      #output::-webkit-scrollbar { width: 10px; height: 10px; }
      #output::-webkit-scrollbar-thumb {
        border: 3px solid transparent;
        border-radius: 999px;
        background: rgba(255, 255, 255, .13);
        background-clip: content-box;
      }
      .ansi-bold { font-weight: 700; }
      .ansi-italic { font-style: italic; }
      .ansi-dim { opacity: .72; }
      body[data-zen="true"] main {
        grid-template-rows: auto minmax(0, 1fr);
      }
      body[data-zen="true"] .eyebrow,
      body[data-zen="true"] .intro,
      body[data-zen="true"] #output-controls,
      body[data-zen="true"] .script p {
        display: none;
      }
      body[data-zen="true"] .script {
        grid-template-rows: auto;
        min-height: 58px;
        padding: 10px 12px;
        border-radius: 8px;
      }
      body[data-zen="true"] .script button {
        grid-row: 1;
        width: 32px;
        height: 32px;
        font-size: 17px;
      }
      body[data-zen="true"] #scripts {
        gap: 7px;
      }
      body[data-zen="true"] .script-group {
        margin: 5px 2px 0;
      }
      body[data-zen="true"] .script h2 {
        font-size: 13px;
      }
      body[data-zen="true"] #zen-indicator {
        display: flex;
      }
      body[data-terminal="true"]::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 29;
        background: rgba(0, 0, 0, .72);
        backdrop-filter: blur(5px);
      }
      body[data-terminal="true"] #output {
        position: fixed;
        inset: 18px;
        z-index: 30;
        width: auto;
        height: auto;
        padding: 22px 24px 40px;
        border-color: #465161;
      }
      body[data-terminal="true"] #terminal-close { display: grid; }
      @media (max-width: 760px) {
        body { height: auto; overflow: auto; }
        main {
          display: block;
          height: auto;
          padding: 32px 0;
        }
        header, #scripts { margin-bottom: 24px; }
        #output-controls {
          display: flex;
          flex-wrap: wrap;
          width: 100%;
          margin-bottom: 24px;
          overflow: visible;
        }
        .control-group {
          flex: 1 1 auto;
          border-bottom: 1px solid var(--rule);
        }
        #zen-toggle { flex: 1 1 100%; justify-content: center; }
        #output { min-height: 420px; }
      }
      @media (max-width: 560px) {
        .script { grid-template-columns: 1fr; }
        .script p, .script button { grid-column: 1; }
        .script button { grid-row: auto; width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">Three useful scripts</p>
        <h1>Scripts Runner 2</h1>
        <p class="intro">A small launcher for one macOS setup task and one dependency smoke test.</p>
      </header>
      <div id="output-controls" aria-label="Output appearance">
        <div class="control-group">
          <span class="iconify" data-icon="mdi:format-size" aria-hidden="true"></span>
          <span>Size</span>
          <div id="font-sizes" class="preset-options">
            <button type="button" data-size="11">Small</button>
            <button type="button" data-size="14">Medium</button>
            <button type="button" data-size="18">Large</button>
          </div>
        </div>
        <div class="control-group">
          <span class="iconify" data-icon="mdi:format-font" aria-hidden="true"></span>
          <span>Font</span>
          <div id="font-families" class="preset-options">
            <button type="button" data-font="jetbrains">JetBrains</button>
            <button type="button" data-font="system">System</button>
            <button type="button" data-font="menlo">Menlo</button>
          </div>
        </div>
        <button id="zen-toggle" type="button" aria-pressed="false">
          <span class="iconify" data-icon="mdi:fullscreen" aria-hidden="true"></span>
          Zen mode <kbd>Z</kbd>
        </button>
      </div>
      <section id="scripts" aria-label="Scripts"></section>
      <pre id="output" tabindex="0" aria-live="polite"></pre>
    </main>
    <button id="zen-indicator" type="button" aria-label="Exit Zen mode">
      <span class="iconify" data-icon="mdi:fullscreen-exit" aria-hidden="true"></span>
      Zen mode · <kbd>Z</kbd> to exit
    </button>
    <button id="terminal-close" type="button" aria-label="Close large terminal view"
      title="Close large terminal view (T)">
      <span class="iconify" data-icon="mdi:close" aria-hidden="true"></span>
    </button>
    <script type="module">
      import { renderOutput } from "../../26.8.21-repos/script-runner/ansi.js";

      const API = "/api/apps/script-runner";
      const scriptOrder = [
        "demo/multilang-smoke-test",
        "setup/setup1-permissions",
        "setup/setup2-defaults",
      ];
      const wanted = new Set(scriptOrder);
      const scriptsRoot = document.querySelector("#scripts");
      const output = document.querySelector("#output");
      const fontSizes = document.querySelector("#font-sizes");
      const fontFamilies = document.querySelector("#font-families");
      const zenToggle = document.querySelector("#zen-toggle");
      const zenIndicator = document.querySelector("#zen-indicator");
      const terminalClose = document.querySelector("#terminal-close");
      const fonts = {
        jetbrains: '"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace',
        system: "SFMono-Regular, ui-monospace, monospace",
        menlo: "Menlo, Monaco, 'Courier New', monospace",
      };
      const RUNS_KEY = "scripts-runner2.last-runs";
      const lastRuns = loadRuns();
      let activeController;

      function loadRuns() {
        try {
          return JSON.parse(localStorage.getItem(RUNS_KEY)) ?? {};
        } catch {
          return {};
        }
      }

      function saveRuns() {
        try {
          localStorage.setItem(RUNS_KEY, JSON.stringify(lastRuns));
        } catch {
          // A completed run remains visible even if browser storage is full.
        }
      }

      function toggleZenMode() {
        const enabled = document.body.dataset.zen !== "true";
        setZenMode(enabled);
      }

      function setZenMode(enabled) {
        document.body.dataset.zen = String(enabled);
        zenToggle.setAttribute("aria-pressed", String(enabled));
        localStorage.setItem("scripts-runner2.zen", String(enabled));
      }

      setZenMode(localStorage.getItem("scripts-runner2.zen") === "true");
      zenToggle.addEventListener("click", toggleZenMode);
      zenIndicator.addEventListener("click", toggleZenMode);
      terminalClose.addEventListener("click", toggleTerminalView);

      function toggleTerminalView() {
        const enabled = document.body.dataset.terminal !== "true";
        document.body.dataset.terminal = String(enabled);
        terminalClose.setAttribute("aria-expanded", String(enabled));
        if (enabled) output.focus();
      }

      document.addEventListener("keydown", (event) => {
        const typing = event.target.closest("input, button, select, textarea, [contenteditable]");
        if (
          event.key.toLowerCase() === "t" && !event.metaKey && !event.ctrlKey && !event.altKey &&
          !typing
        ) {
          event.preventDefault();
          toggleTerminalView();
          return;
        }
        if (
          event.key.toLowerCase() !== "z" || event.metaKey || event.ctrlKey || event.altKey ||
          typing
        ) return;
        event.preventDefault();
        toggleZenMode();
      });

      function selectPreset(root, attribute, value) {
        for (const button of root.querySelectorAll("button")) {
          button.setAttribute("aria-pressed", String(button.dataset[attribute] === value));
        }
      }

      const savedFontSize = localStorage.getItem("scripts-runner2.output-font-size") ?? "14";
      const savedFont = localStorage.getItem("scripts-runner2.output-font") ?? "jetbrains";
      output.style.fontSize = `${savedFontSize}px`;
      output.style.setProperty("font-family", fonts[savedFont] ?? fonts.jetbrains);
      selectPreset(fontSizes, "size", savedFontSize);
      selectPreset(fontFamilies, "font", savedFont);

      fontSizes.addEventListener("click", (event) => {
        const button = event.target.closest("[data-size]");
        if (!button) return;
        output.style.fontSize = `${button.dataset.size}px`;
        selectPreset(fontSizes, "size", button.dataset.size);
        localStorage.setItem("scripts-runner2.output-font-size", button.dataset.size);
      });
      fontFamilies.addEventListener("click", (event) => {
        const button = event.target.closest("[data-font]");
        if (!button) return;
        output.style.setProperty("font-family", fonts[button.dataset.font]);
        selectPreset(fontFamilies, "font", button.dataset.font);
        localStorage.setItem("scripts-runner2.output-font", button.dataset.font);
      });

      function card(script) {
        const article = document.createElement("article");
        article.className = "script";
        article.dataset.scriptId = script.id;
        article.tabIndex = 0;
        article.setAttribute("aria-selected", "false");
        const title = document.createElement("h2");
        title.textContent = script.name;
        if (lastRuns[script.id]) addRunMark(article, title);
        const description = document.createElement("p");
        description.textContent = script.description;
        const run = document.createElement("button");
        run.type = "button";
        run.title = `Run ${script.name}`;
        run.setAttribute("aria-label", `Run ${script.name}`);
        const runIcon = document.createElement("span");
        runIcon.className = "iconify";
        runIcon.dataset.icon = "mdi:play";
        run.append(runIcon);
        run.addEventListener("click", (event) => {
          event.stopPropagation();
          runScript(script, run);
        });
        article.addEventListener("click", () => showLastRun(script.id));
        article.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" && event.key !== " ") return;
          event.preventDefault();
          showLastRun(script.id);
        });
        article.append(title, description, run);
        return article;
      }

      function groupHeading(label) {
        const heading = document.createElement("h2");
        heading.className = "script-group";
        heading.textContent = label;
        return heading;
      }

      function addRunMark(article, title) {
        article.dataset.ran = "true";
        if (title.querySelector(".run-mark")) return;
        const mark = document.createElement("span");
        mark.className = "iconify run-mark";
        mark.dataset.icon = "mdi:check-circle";
        mark.title = "Previously run";
        title.append(mark);
      }

      function showLastRun(scriptId) {
        const saved = lastRuns[scriptId];
        if (!saved) return;
        paintOutput(saved.output);
        for (const article of scriptsRoot.querySelectorAll(".script")) {
          article.setAttribute("aria-selected", String(article.dataset.scriptId === scriptId));
        }
      }

      async function runScript(script, button) {
        activeController?.abort();
        activeController = new AbortController();
        button.disabled = true;
        button.querySelector(".iconify").dataset.icon = "mdi:progress-clock";
        let outputText = `$ ${script.name}\n\n`;
        paintOutput(outputText);
        try {
          const response = await fetch(`${API}/runs`, {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ scriptId: script.id }),
            signal: activeController.signal,
          });
          if (!response.ok) throw new Error((await response.json()).error ?? "Run failed");
          const reader = response.body.getReader();
          const decoder = new TextDecoder();
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            outputText += decoder.decode(value, { stream: true });
            paintOutput(outputText);
            output.scrollTop = output.scrollHeight;
          }
        } catch (error) {
          if (error.name !== "AbortError") {
            outputText += `\n${error.message}\n`;
            paintOutput(outputText);
          }
        } finally {
          lastRuns[script.id] = { output: outputText, ranAt: Date.now() };
          saveRuns();
          const article = scriptsRoot.querySelector(`[data-script-id="${CSS.escape(script.id)}"]`);
          const title = article?.querySelector("h2");
          if (article && title) addRunMark(article, title);
          button.disabled = false;
          button.querySelector(".iconify").dataset.icon = "mdi:play";
        }
      }

      function paintOutput(text) {
        output.replaceChildren(renderOutput(text));
      }

      try {
        const response = await fetch(`${API}/catalog`, { cache: "no-store" });
        if (!response.ok) throw new Error(`Could not load scripts (${response.status})`);
        const catalog = await response.json();
        const scripts = catalog.scripts.filter((script) => wanted.has(script.id)).sort((a, b) =>
          scriptOrder.indexOf(a.id) - scriptOrder.indexOf(b.id)
        );
        const testScripts = scripts.filter((script) => script.id === "demo/multilang-smoke-test");
        const setupScripts = scripts.filter((script) => script.id !== "demo/multilang-smoke-test");
        scriptsRoot.replaceChildren(
          groupHeading("Test"),
          ...testScripts.map(card),
          groupHeading("Setup"),
          ...setupScripts.map(card),
        );
        if (scripts.length !== wanted.size) {
          output.textContent = "One or more selected scripts could not be found.";
        }
      } catch (error) {
        output.textContent = error.message;
      }
    </script>
  </body>
</html>
