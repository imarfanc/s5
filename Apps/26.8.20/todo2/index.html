<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Todo</title>
    <style>
      :root {
        color-scheme: light dark;
        --page: #f1f5f4;
        --panel: #ffffff;
        --field: #ffffff;
        --ink: #16302d;
        --muted: #5a6f6c;
        --line: #d9e4e1;
        --field-line: #aebfbb;
        --accent: #0f766e;
        --accent-hover: #0b625c;
        --accent-text: #ffffff;
        --danger: #a83229;
        --danger-hover: #87251f;
        --done: #71847f;
        --shadow: 0 20px 50px rgb(15 118 110 / 10%);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        background: var(--page);
        color: var(--ink);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0f1614;
          --panel: #18211e;
          --field: #111916;
          --ink: #edf5f2;
          --muted: #9aada7;
          --line: #33443e;
          --field-line: #4c625a;
          --accent: #55bda8;
          --accent-hover: #71cfbc;
          --accent-text: #071411;
          --danger: #ff8c7e;
          --danger-hover: #ffafa5;
          --done: #82958f;
          --shadow: 0 20px 55px rgb(0 0 0 / 32%);
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; padding: 1.25rem; background: var(--page); }
      main {
        width: min(100%, 38rem);
        margin: 5vh auto;
        padding: clamp(1.25rem, 4vw, 2.25rem);
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 1.25rem;
        box-shadow: var(--shadow);
      }
      nav a { color: var(--accent); text-decoration: none; }
      h1 { margin: 1.25rem 0 .25rem; font-size: clamp(2rem, 7vw, 3rem); letter-spacing: -.05em; }
      .intro { margin: 0 0 1.5rem; color: var(--muted); }
      form { display: flex; gap: .65rem; }
      input[type="text"] {
        min-width: 0;
        flex: 1;
        padding: .8rem 1rem;
        border: 1px solid var(--field-line);
        border-radius: .7rem;
        background: var(--field);
        color: var(--ink);
        font: inherit;
      }
      input[type="text"]::placeholder { color: var(--muted); opacity: .8; }
      input[type="text"]:focus-visible, button:focus-visible, a:focus-visible {
        outline: 3px solid color-mix(in srgb, var(--accent) 55%, transparent);
        outline-offset: 2px;
      }
      button {
        border: 0;
        border-radius: .7rem;
        padding: .8rem 1rem;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      form button { background: var(--accent); color: var(--accent-text); }
      form button:hover { background: var(--accent-hover); }
      #status { min-height: 1.5rem; margin: 1rem 0 .4rem; color: var(--muted); }
      #status.error { color: var(--danger); }
      ul { list-style: none; margin: 0; padding: 0; }
      li { display: grid; grid-template-columns: auto 1fr auto; gap: .8rem; align-items: center; padding: .85rem 0; border-top: 1px solid var(--line); }
      li.done span { color: var(--done); text-decoration: line-through; }
      li button { padding: .4rem .6rem; background: transparent; color: var(--danger); }
      li button:hover { color: var(--danger-hover); background: color-mix(in srgb, var(--danger) 10%, transparent); }
      input[type="checkbox"] { width: 1.15rem; height: 1.15rem; accent-color: var(--accent); }
      .summary { margin: 1.1rem 0 0; color: var(--muted); font-size: .9rem; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); }
    </style>
  </head>
  <body>
    <main>
      <nav><a href="../../../index.html">← All apps</a></nav>
      <h1>Todo</h1>
      <p class="intro">A small list, saved in SQLite on the server.</p>
      <form id="todo-form">
        <label class="sr-only" for="todo-input">New todo</label>
        <input id="todo-input" type="text" maxlength="500" placeholder="What needs doing?" required autocomplete="off">
        <button type="submit">Add</button>
      </form>
      <p id="status" role="status"></p>
      <ul id="todo-list"></ul>
      <p id="summary" class="summary" hidden></p>
    </main>
    <script type="module">
      import { db } from "/shared/db.js";

      const todos = db();
      const form = document.querySelector("#todo-form");
      const input = document.querySelector("#todo-input");
      const list = document.querySelector("#todo-list");
      const status = document.querySelector("#status");
      const summary = document.querySelector("#summary");
      let rows = [];

      function setStatus(message = "", error = false) {
        status.textContent = message;
        status.classList.toggle("error", error);
      }

      function render() {
        list.replaceChildren(...rows.map((todo) => {
          const done = todo.done === 1;
          const item = document.createElement("li");
          item.className = done ? "done" : "";
          const checkbox = document.createElement("input");
          checkbox.type = "checkbox";
          checkbox.checked = done;
          checkbox.setAttribute("aria-label", `Mark ${todo.text} as ${done ? "incomplete" : "complete"}`);
          checkbox.addEventListener("change", () => act(() => todos.run("setDone", [done ? 0 : 1, todo.id])));
          const text = document.createElement("span");
          text.textContent = todo.text;
          const remove = document.createElement("button");
          remove.type = "button";
          remove.textContent = "Delete";
          remove.setAttribute("aria-label", `Delete ${todo.text}`);
          remove.addEventListener("click", () => act(() => todos.run("deleteTodo", [todo.id])));
          item.append(checkbox, text, remove);
          return item;
        }));
        const remaining = rows.filter((todo) => todo.done !== 1).length;
        summary.hidden = rows.length === 0;
        summary.textContent = `${remaining} of ${rows.length} remaining`;
        setStatus(rows.length === 0 ? "No todos yet." : "");
      }

      /**
       * Run a write, then re-read the list.
       *
       * Rows live on the server, so the server is the only thing that knows
       * what the list is now — refetching is both simpler than patching a local
       * copy and correct when another tab has been editing the same table.
       */
      async function act(write) {
        try {
          if (write) await write();
          rows = await todos.rows("listTodos");
          render();
        } catch (error) {
          setStatus(error.message || "Could not reach the database.", true);
        }
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        act(() => todos.run("addTodo", [text]));
      });

      act();
    </script>
  </body>
</html>
