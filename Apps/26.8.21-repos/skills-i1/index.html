<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Skills Hub</title>
    <link id="app-favicon" rel="icon" href="./favicon.svg">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/iconify/3.1.1/iconify.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <style>
    :root {
      color-scheme: light dark;
      /* Read by the parent app browser to tint its chrome. */
      --accent: #1f4dff;
      --paper: #eceef2;
      --card: #ffffff;
      --rule: #d2d7df;
      --ink: #0d1117;
      --soft: #626b78;
      --signal: #1f4dff;
      --done: #0a7c4a;
      --warn: #9a6700;
      --danger: #b3261e;
      --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, monospace;
      --sans: ui-sans-serif, -apple-system, "Segoe UI", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0d1014;
        --card: #14181d;
        --rule: #272d36;
        --ink: #e7ebf1;
        --soft: #8b95a3;
        --signal: #7d97ff;
        --done: #4ec78d;
        --warn: #e3b341;
        --danger: #f85149;
      }
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 3.5rem 1.5rem 6rem;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.5 var(--sans);
    }
    #app-shell {
      max-width: 58rem;
      margin: 0 auto;
    }
    #app-title {
      margin: 0 0 2.25rem;
      font: 600 0.8rem/1 var(--mono);
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }
    #app-title span {
      color: var(--soft);
    }

    #target-panel {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1rem;
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 6px;
    }
    #target-select,
    #target-custom {
      font: 0.86rem var(--mono);
      color: inherit;
      padding: 0.38rem 0.5rem;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 4px;
    }
    #target-custom {
      flex: 1 1 15rem;
      min-width: 10rem;
    }
    #target-custom::placeholder {
      color: var(--soft);
    }
    #opener-group {
      display: flex;
      gap: 0.35rem;
      margin-left: auto;
    }

    #target-resolved {
      margin: 0.55rem 0 2.25rem;
      padding-left: 1rem;
      font: 0.78rem/1.4 var(--mono);
      color: var(--soft);
      word-break: break-all;
    }
    #target-resolved b {
      color: var(--ink);
      font-weight: 500;
    }

    #skill-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }
    #skill-list li {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 0.45rem 2rem;
      align-items: center;
      padding: 1.05rem 1rem;
      background: var(--card);
      border: 1px solid var(--rule);
      border-bottom-width: 0;
    }
    #skill-list li:first-child {
      border-radius: 6px 6px 0 0;
    }
    #skill-list li:last-child {
      border-radius: 0 0 6px 6px;
      border-bottom-width: 1px;
    }
    #skill-list li:only-child {
      border-radius: 6px;
    }
    .skill-name {
      font: 500 0.95rem var(--mono);
    }
    #skill-list li.skill-group {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.6rem 1rem;
      background: var(--paper);
      color: var(--soft);
      font: 500 0.75rem var(--mono);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }
    .skill-meta {
      margin-top: 0.25rem;
      color: var(--soft);
      font-size: 0.87rem;
      max-width: 62ch;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      overflow: hidden;
    }
    .skill-actions {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font: 0.8rem var(--mono);
      padding: 0.34rem 0.55rem;
      color: var(--soft);
      background: transparent;
      border: 1px solid var(--rule);
      border-radius: 4px;
      cursor: pointer;
      transition: color 120ms, border-color 120ms;
    }
    button:hover {
      color: var(--signal);
      border-color: var(--signal);
    }
    button:focus-visible {
      outline: 2px solid var(--signal);
      outline-offset: 2px;
    }
    button[data-installed="true"] {
      color: var(--done);
      border-color: color-mix(in srgb, var(--done) 45%, var(--rule));
    }
    .iconify {
      font-size: 1em;
    }

    #config-error {
      margin: 0 0 1.75rem;
      padding: 0.55rem 0.85rem;
      background: var(--card);
      border: 1px solid color-mix(in srgb, var(--warn) 45%, var(--rule));
      border-radius: 6px;
      color: var(--warn);
      font: 0.82rem/1.45 var(--mono);
    }
    #config-error:empty {
      display: none;
    }

    #skill-filter {
      display: block;
      width: 100%;
      margin: 0 0 1rem;
      padding: 0.45rem 0.6rem;
      font: 0.86rem var(--mono);
      color: inherit;
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 6px;
    }
    #skill-filter::placeholder {
      color: var(--soft);
    }

    button.skill-name {
      padding: 0;
      background: none;
      border: 0;
      color: var(--ink);
      font: 500 0.95rem var(--mono);
      text-align: left;
      text-decoration: underline dotted;
      text-underline-offset: 3px;
    }
    button.skill-name:hover {
      color: var(--signal);
      border-color: transparent;
    }
    .skill-warning {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin-top: 0.3rem;
      color: var(--warn);
      font-size: 0.8rem;
    }
    button[data-kind="remove"]:hover {
      color: var(--danger);
      border-color: var(--danger);
    }

    #skill-preview {
      width: min(92vw, 44rem);
      max-height: 80vh;
      padding: 0;
      border: 1px solid var(--rule);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
    }
    #skill-preview::backdrop {
      background: rgb(0 0 0 / 0.5);
    }
    #preview-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid var(--rule);
    }
    #preview-title {
      margin: 0;
      font: 600 0.95rem var(--mono);
    }
    #preview-body {
      padding: 0.25rem 1.25rem 1.25rem;
      overflow-y: auto;
      max-height: calc(80vh - 4.5rem);
    }
    #preview-body h1 {
      font-size: 1.25rem;
      margin: 1rem 0 0.5rem;
    }
    #preview-body h2 {
      font-size: 1.05rem;
      margin: 1rem 0 0.4rem;
    }
    #preview-body h3 {
      font-size: 0.95rem;
      margin: 0.9rem 0 0.35rem;
    }
    #preview-body p {
      margin: 0.6rem 0;
    }
    #preview-body pre {
      overflow-x: auto;
      padding: 0.7rem 0.9rem;
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 6px;
      font: 0.82rem/1.5 var(--mono);
    }
    #preview-body code {
      font: 0.88em var(--mono);
    }
    #preview-body a {
      color: var(--signal);
    }

    #status {
      position: fixed;
      left: 50%;
      bottom: 1.5rem;
      transform: translateX(-50%);
      max-width: 90vw;
      padding: 0.5rem 0.85rem;
      background: var(--card);
      border: 1px solid var(--rule);
      border-radius: 4px;
      box-shadow: 0 8px 26px rgb(0 0 0 / 0.16);
      font: 0.82rem var(--mono);
    }
    #status:empty {
      display: none;
    }
    #status[data-ok="false"] {
      color: #b3261e;
    }

    @media (max-width: 42rem) {
      #skill-list li {
        grid-template-columns: 1fr;
      }
      .skill-actions {
        justify-content: flex-start;
      }
      #opener-group {
        margin-left: 0;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      * {
        transition: none !important;
      }
    }
    </style>
  </head>
  <body>
    <main id="app-shell">
      <h1 id="app-title">skills hub <span id="skill-count"></span></h1>

      <section id="target-panel">
        <select id="target-select" aria-label="Target"></select>
        <input id="target-custom" type="text" placeholder="or type a path" spellcheck="false">
        <div id="opener-group"></div>
      </section>
      <p id="target-resolved"></p>

      <p id="config-error" role="alert"></p>
      <input id="skill-filter" type="search" placeholder="Filter skills" aria-label="Filter skills"
        autocomplete="off" spellcheck="false">

      <ul id="skill-list"></ul>
    </main>
    <dialog id="skill-preview" aria-labelledby="preview-title">
      <div id="preview-head">
        <h2 id="preview-title"></h2>
        <button id="preview-close" type="button" title="Close preview">
          <span class="iconify" data-icon="ph:x-bold" aria-hidden="true"></span>close
        </button>
      </div>
      <div id="preview-body"></div>
    </dialog>
    <p id="status" role="status" aria-live="polite"></p>

    <script type="module">
    const listElement = document.querySelector("#skill-list");
    const countElement = document.querySelector("#skill-count");
    const selectElement = document.querySelector("#target-select");
    const customElement = document.querySelector("#target-custom");
    const resolvedElement = document.querySelector("#target-resolved");
    const openerElement = document.querySelector("#opener-group");
    const statusElement = document.querySelector("#status");
    const filterElement = document.querySelector("#skill-filter");
    const configErrorElement = document.querySelector("#config-error");
    const previewDialog = document.querySelector("#skill-preview");
    const previewTitle = document.querySelector("#preview-title");
    const previewBody = document.querySelector("#preview-body");
    const previewClose = document.querySelector("#preview-close");

    let settings = { agents: [], targets: [], openers: [], defaultTargetId: "", configError: null };
    let skills = [];
    let statusTimer;

    function icon(name) {
      const element = document.createElement("span");
      element.className = "iconify";
      element.dataset.icon = name;
      element.setAttribute("aria-hidden", "true");
      return element;
    }

    function button(iconName, label, title, onClick) {
      const element = document.createElement("button");
      element.type = "button";
      element.title = title;
      element.setAttribute("aria-label", title);
      element.append(icon(iconName), label);
      element.addEventListener("click", onClick);
      return element;
    }

    function say(message, ok = true) {
      statusElement.textContent = message;
      statusElement.dataset.ok = String(ok);
      clearTimeout(statusTimer);
      statusTimer = setTimeout(() => (statusElement.textContent = ""), 4500);
    }

    /** The browser names a target; the server resolves it. Custom path wins. */
    function targetBody() {
      const custom = customElement.value.trim();
      return custom ? { path: custom } : { target: selectElement.value };
    }

    async function post(endpoint, body) {
      const response = await fetch(endpoint, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ ...targetBody(), ...body }),
      });
      return await response.json();
    }

    async function loadSettings() {
      settings = await (await fetch("/api/apps/skills-i1/settings")).json();
      configErrorElement.textContent = settings.configError ?? "";
      selectElement.replaceChildren(...settings.targets.map((target) => {
        const option = document.createElement("option");
        option.value = target.id;
        option.textContent = target.label;
        option.selected = target.id === settings.defaultTargetId;
        return option;
      }));
      openerElement.replaceChildren(
        ...settings.openers.map((opener) =>
          button(opener.icon, opener.label, `Open this folder in ${opener.label}`, async () => {
            const result = await post("/api/apps/skills-i1/open", { opener: opener.id });
            say(result.message, result.ok);
          })
        ),
      );
    }

    async function refresh() {
      const custom = customElement.value.trim();
      const query = custom
        ? `path=${encodeURIComponent(custom)}`
        : `target=${encodeURIComponent(selectElement.value)}`;
      const data = await (await fetch(`/api/apps/skills-i1/skills?${query}`)).json();
      showPath(data.targetPath);
      skills = data.skills;
      render();
    }

    /** Rows for the skills that survive the current filter. */
    function render() {
      const needle = filterElement.value.trim().toLowerCase();
      const shown = needle
        ? skills.filter((skill) =>
          [skill.id, skill.name, skill.group, skill.title, skill.description].join(" ")
            .toLowerCase().includes(needle)
        )
        : skills;
      countElement.textContent = `— ${shown.length}${needle ? ` of ${skills.length}` : ""}`;
      listElement.replaceChildren(
        ...(shown.length ? rowsWithGroups(shown) : [Object.assign(document.createElement("li"), {
          textContent: needle
            ? "No skills match the filter."
            : "No skills yet. Add a folder with a SKILL.md under skills/ (or in a group folder there).",
        })]),
      );
    }

    /**
     * Skills can sit in a group folder under `skills/`. Print a heading the first
     * time a group appears so the list reads as sections rather than one long
     * run of names that happen to be sorted together.
     */
    function rowsWithGroups(shown) {
      const nodes = [];
      let lastGroup = null;
      for (const skill of shown) {
        const group = skill.group ?? "";
        if (group !== lastGroup) {
          lastGroup = group;
          if (group !== "") {
            const heading = document.createElement("li");
            heading.className = "skill-group";
            heading.setAttribute("role", "presentation");
            heading.append(icon("ph:folder-simple-bold"), document.createTextNode(group));
            nodes.push(heading);
          }
        }
        nodes.push(row(skill));
      }
      return nodes;
    }

    /** Dim the path's ancestry so the folder you are acting on reads first. */
    function showPath(path) {
      const segments = path.replace(/\/$/, "").split("/");
      const last = segments.pop();
      resolvedElement.replaceChildren(
        document.createTextNode(`${segments.join("/")}/`),
        Object.assign(document.createElement("b"), { textContent: last }),
      );
    }

    function row(skill) {
      const item = document.createElement("li");
      const info = document.createElement("div");

      const nameButton = document.createElement("button");
      nameButton.type = "button";
      nameButton.className = "skill-name";
      nameButton.textContent = skill.name;
      nameButton.title = `Preview ${skill.name}`;
      nameButton.setAttribute("aria-label", `Preview ${skill.name}`);
      nameButton.addEventListener("click", () => openPreview(skill));

      info.append(
        nameButton,
        Object.assign(document.createElement("div"), {
          className: "skill-meta",
          textContent: skill.description || `${skill.fileCount} file(s)`,
        }),
      );
      for (const warning of skill.warnings ?? []) {
        const flag = document.createElement("div");
        flag.className = "skill-warning";
        flag.append(icon("ph:warning-bold"), document.createTextNode(warning));
        info.append(flag);
      }

      const actions = document.createElement("div");
      actions.className = "skill-actions";
      for (const agent of settings.agents) {
        const installed = skill.installed.includes(agent.id);
        const element = button(
          installed ? "ph:check-bold" : "ph:plus-bold",
          agent.label,
          installed
            ? `Replace in ${agent.dir}/${agent.skillsSubdir}/`
            : `Install into ${agent.dir}/${agent.skillsSubdir}/`,
          async () => {
            const result = await post("/api/apps/skills-i1/install", {
              skill: skill.id,
              agent: agent.id,
              overwrite: installed,
            });
            say(`${skill.name}: ${result.message}`, result.ok);
            await refresh();
          },
        );
        element.dataset.installed = String(installed);
        actions.append(element);
        if (installed) {
          const remove = button(
            "ph:minus-bold",
            "",
            `Remove from ${agent.dir}/${agent.skillsSubdir}/`,
            async () => {
              const where = `${agent.dir}/${agent.skillsSubdir}/`;
              if (!confirm(`Remove ${skill.name} from ${where}? Edits made there are lost.`)) return;
              const result = await post("/api/apps/skills-i1/uninstall", {
                skill: skill.id,
                agent: agent.id,
              });
              say(`${skill.name}: ${result.message}`, result.ok);
              await refresh();
            },
          );
          remove.dataset.kind = "remove";
          actions.append(remove);
        }
      }
      item.append(info, actions);
      return item;
    }

    /** Fetch the SKILL.md body and show it in the preview dialog. */
    async function openPreview(skill) {
      const data = await (await fetch(
        `/api/apps/skills-i1/skill?name=${encodeURIComponent(skill.id)}`,
      )).json();
      if (!data.markdown) {
        say(`Could not load ${skill.name}`, false);
        return;
      }
      previewTitle.textContent = skill.title || skill.name;
      if (window.marked) {
        previewBody.innerHTML = window.marked.parse(data.markdown);
      } else {
        previewBody.replaceChildren(Object.assign(document.createElement("pre"), {
          textContent: data.markdown,
        }));
      }
      previewDialog.showModal();
    }

    previewClose.addEventListener("click", () => previewDialog.close());
    previewDialog.addEventListener("click", (event) => {
      if (event.target === previewDialog) previewDialog.close();
    });
    previewDialog.addEventListener("close", () => previewBody.replaceChildren());

    selectElement.addEventListener("change", refresh);
    customElement.addEventListener("change", refresh);
    filterElement.addEventListener("input", render);

    await loadSettings();
    await refresh();
    </script>
  </body>
</html>
