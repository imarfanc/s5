<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>files-i1</title>
    <link id="app-favicon" rel="icon" href="./favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div id="app">
      <header id="masthead">
        <p id="app-mark">files-i1</p>
        <div id="path-tape">
          <button id="path-home" type="button">~</button>
          <ol id="path-crumbs"></ol>
          <button id="browse-open" type="button">Browse</button>
        </div>
      </header>
      <div id="work">
        <nav id="tool-rail" aria-label="Tools"></nav>
        <main id="panel">
          <form id="tool-form"></form>
          <pre id="ran" hidden></pre>
          <div id="banner" hidden></div>
          <div id="panel-body"></div>
        </main>
      </div>
    </div>
    <dialog id="picker">
      <header id="picker-head">
        <strong>Choose a folder</strong>
        <form method="dialog"><button type="submit">Close</button></form>
      </header>
      <form id="picker-goto">
        <input id="picker-path" type="text" spellcheck="false" aria-label="Folder path">
        <button type="submit">Go</button>
      </form>
      <p id="picker-error" hidden></p>
      <p id="picker-recents-label">Recent</p>
      <ul id="picker-recents"></ul>
      <ul id="picker-list"></ul>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
